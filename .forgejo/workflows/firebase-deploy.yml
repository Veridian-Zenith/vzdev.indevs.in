# Deploys Firebase Hosting + Firestore rules from git.gay.
# Forgejo Actions only reads `.forgejo/workflows`, so this replaces the former
# `.github/workflows/firebase-deploy.yml`.
name: Firebase Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: https://github.com/actions/checkout@v4

      - name: Set up Bun
        uses: https://github.com/oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify required secrets
        run: |
          set -euo pipefail
          missing=""
          for name in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID \
                      VITE_FIREBASE_STORAGE_BUCKET VITE_FIREBASE_MESSAGING_SENDER_ID \
                      VITE_FIREBASE_APP_ID FIREBASE_SERVICE_ACCOUNT_MAIN_WEBSITE_BA2DA; do
            if [ -z "${!name:-}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "Secret names this workflow can see (names only):"
            echo '${{ toJSON(secrets) }}' | jq -r 'keys[]' | sort
            exit 1
          fi
          echo "all required secrets present"
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT_MAIN_WEBSITE_BA2DA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MAIN_WEBSITE_BA2DA }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}

      - name: Write service account key
        run: |
          set -euo pipefail
          umask 077
          key="$GITHUB_WORKSPACE/service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$key"
          valid() { jq -e '.type == "service_account" and .private_key and .client_email' "$1" > /dev/null 2>&1; }
          if ! valid "$key"; then
            # Secret stores may strip newlines; base64 of the key survives that.
            if base64 -d "$key" > "$key.dec" 2>/dev/null && valid "$key.dec"; then
              mv "$key.dec" "$key"
            else
              rm -f "$key.dec"
              echo "::error::FIREBASE_SERVICE_ACCOUNT_MAIN_WEBSITE_BA2DA is not a usable service-account key. Paste the raw JSON of service-account.json, or its base64 encoding."
              exit 1
            fi
          fi
          echo "service account key accepted for $(jq -r .client_email "$key")"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MAIN_WEBSITE_BA2DA }}

      - name: Deploy to Firebase Hosting and Firestore
        run: bunx firebase-tools@latest deploy --only hosting,firestore --project main-website-ba2da --force
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/service-account.json

      - name: Remove the key
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/service-account.json"
